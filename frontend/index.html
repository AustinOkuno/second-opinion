<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Second Opinion</title>
  <meta name="description" content="Paste a suspicious text, email, or voicemail and get a plain-language answer: is it a scam, why, and what to do next.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Icons. Use one anywhere with: <svg><use href="#i-name"/></svg> -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-shield" viewBox="0 0 32 32"><path d="M16 3l11 4v8c0 7-4.6 11.6-11 14C9.6 26.6 5 22 5 15V7z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M11 15.5l3.6 3.6 6.6-7.2" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M8.2 2.8h7.6l5.4 5.4v7.6l-5.4 5.4H8.2l-5.4-5.4V8.2z"/><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M9 9l6 6M15 9l-6 6"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M12 3.2l9.4 16.3H2.6z"/><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M12 9.5v4.6M12 17.2v.1"/></symbol>
    <symbol id="i-ok" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="2"/><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M7.6 12.4l3.1 3.1 5.7-6.4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-msg" viewBox="0 0 24 24"><path d="M4 5.5h16v10H9.5L5 19.5v-4H4z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M8 9.5h8M8 12.5h5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
    <symbol id="i-img" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.9"/><circle cx="9" cy="10" r="1.7" fill="currentColor"/><path d="M4.5 17l4.5-4 3.5 3 3-2.5 4 3.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" d="M5 3.5h3.5l1.7 4.3-2.2 1.4a11 11 0 0 0 6.8 6.8l1.4-2.2 4.3 1.7V19a2 2 0 0 1-2.1 2A16.5 16.5 0 0 1 3 5.6 2 2 0 0 1 5 3.5z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M10 8.5l5.5 3.5-5.5 3.5z" fill="currentColor"/></symbol>
    <symbol id="i-speak" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 19.5c.5-3.5 3-5.5 6-5.5s5.5 2 6 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M16 5.5a3 3 0 0 1 0 6M18.5 14.5c1.6.8 2.6 2.4 2.9 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-new" viewBox="0 0 24 24"><path d="M12 20h8M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  </defs>
</svg>

<header class="top">
  <div class="brand"><svg aria-hidden="true"><use href="#i-shield"/></svg><span>Second Opinion</span></div>
  <div class="seg" role="group" aria-label="What do you need help with?">
    <button type="button" data-mode="chat" aria-pressed="true"><svg class="i" aria-hidden="true"><use href="#i-msg"/></svg>Check a message</button>
    <button type="button" data-mode="call" aria-pressed="false"><svg class="i" aria-hidden="true"><use href="#i-phone"/></svg>On a call</button>
  </div>
  <div class="right">
    <div class="sizes" role="group" aria-label="Text size">
      <button type="button" data-size="m" aria-pressed="true" aria-label="Normal text" style="font-size:.85rem">A</button>
      <button type="button" data-size="l" aria-pressed="false" aria-label="Large text" style="font-size:1.1rem">A</button>
      <button type="button" data-size="xl" aria-pressed="false" aria-label="Extra large text" style="font-size:1.4rem">A</button>
    </div>
    <button type="button" class="ghost" id="newBtn" hidden><svg class="i" aria-hidden="true"><use href="#i-new"/></svg><span class="lbl">New check</span></button>
  </div>
</header>

<main class="stage" id="stage">
  <div class="col">

    <!-- Message mode -->
    <section class="hero chat-only">
      <h1>What would you like me to check?</h1>
      <p>Paste a text, email, or voicemail. I'll tell you if it looks like a scam and what to do next.</p>
    </section>

    <div class="stream chat-only" id="stream" aria-live="polite"></div>

    <div class="dock chat-only">
      <form class="composer" id="form" autocomplete="off">
        <div class="attach" id="attach">
          <img id="attachImg" alt="">
          <span id="attachName"></span>
          <button type="button" id="attachRemove">Remove</button>
        </div>
        <div class="bar">
          <button type="button" class="icon-btn" id="attachBtn" aria-label="Add a screenshot" title="Add a screenshot"><svg aria-hidden="true"><use href="#i-plus"/></svg></button>
          <label for="msg" class="sr-only">Message to check</label>
          <textarea id="msg" rows="1" placeholder="Paste the message here"></textarea>
          <button type="submit" class="send" aria-label="Check this"><span class="lbl">Check</span><svg aria-hidden="true"><use href="#i-up"/></svg></button>
        </div>
        <input type="file" id="file" accept="image/*" hidden>
      </form>
      <p class="hint" id="hint"></p>
    </div>

    <ul class="suggest chat-only">
      <li><button type="button" data-go="paste"><svg aria-hidden="true"><use href="#i-msg"/></svg><span>Paste a text or email I got</span></button></li>
      <li><button type="button" data-go="shot"><svg aria-hidden="true"><use href="#i-img"/></svg><span>Check a screenshot</span></button></li>
      <li><button type="button" data-go="call" class="call"><svg aria-hidden="true"><use href="#i-phone"/></svg><span>Someone is calling me right now</span></button></li>
      <li><button type="button" data-go="demo"><svg aria-hidden="true"><use href="#i-play"/></svg><span>Show me how it works</span></button></li>
      <li class="privacy"><svg aria-hidden="true"><use href="#i-lock"/></svg><span>Nothing you paste is saved.</span></li>
    </ul>

    <!-- Call mode -->
    <section class="call-view call-only" aria-labelledby="callTitle">
      <h1 id="callTitle">Is this call a scam?</h1>
      <p>Tap anything that is true right now. You can keep the phone to your ear.</p>
      <div class="checks" id="checks">
        <label><input type="checkbox" id="c1"><span>They called me and I wasn't expecting it</span></label>
        <label><input type="checkbox" id="c2"><span>They are rushing me or say I must act now</span></label>
        <label><input type="checkbox" id="c3"><span>They want gift cards, a wire transfer, crypto, or cash</span></label>
        <label><input type="checkbox" id="c4"><span>They want me to install something or use my computer</span></label>
        <label><input type="checkbox" id="c5"><span>They told me to keep this a secret</span></label>
        <label><input type="checkbox" id="c6"><span>They say a family member is in trouble</span></label>
      </div>
      <div class="call-result" id="callResult" aria-live="polite"></div>
    </section>

  </div>
</main>

<div class="drop" id="drop" aria-hidden="true">Drop your screenshot here</div>
<div class="toast" id="toast" role="status"></div>

<!-- Load order matters: config -> mock -> api -> app -->
<script src="config.js"></script>
<script src="mock.js"></script>
<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
